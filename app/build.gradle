plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.ox1de.cardash'
    compileSdk 34

    defaultConfig {
        applicationId 'xyz.ox1de.cardash'
        minSdk 26
        targetSdk 33
        // CI passes the release tag in (v2.4.1 -> 2.4.1 / 2040199); local builds use these defaults.
        // versionCode = (major*10000 + minor*100 + patch)*100 + stage (99 final, N for -betaN): tools/version.sh.
        versionName(project.findProperty('appVersionName') ?: '3.1')
        versionCode((project.findProperty('appVersionCode') ?: '3010099') as int)
    }

    signingConfigs {
        // Every build must be signed with the same key, or Android refuses it as an update.
        // Defaults to the committed keystore; CI can override it with repository secrets.
        cardash {
            storeFile file(project.findProperty('signStoreFile') ?: rootProject.file('keystore/cardash.p12'))
            storeType 'pkcs12'
            storePassword(project.findProperty('signStorePassword') ?: 'cardash')
            keyAlias(project.findProperty('signKeyAlias') ?: 'cardash')
            keyPassword(project.findProperty('signKeyPassword') ?: 'cardash')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.cardash
        }
        debug {
            signingConfig signingConfigs.cardash
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies on purpose: framework-only keeps the app tiny and fast on 2 GB head units.

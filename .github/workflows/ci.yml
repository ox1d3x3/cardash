name: CI

# Every push to a branch and every pull request: build the release APK and keep it as a
# downloadable artifact for 14 days. Tags are handled by release.yml.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: |
          # dev builds sort below the release they lead up to: 2.5-dev+abc1234 -> 2050001 (< v2.5 = 2050099)
          BASE=$(sed -n "s/.*appVersionName') ?: '\([^']*\)'.*/\1/p" app/build.gradle)
          eval "$(bash tools/version.sh "v${BASE}-dev")"
          gradle :app:assembleRelease --no-daemon -PappVersionName="${BASE}-dev+$(git rev-parse --short HEAD)" -PappVersionCode="$code"

      - uses: actions/upload-artifact@v4
        with:
          name: CarDash-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
